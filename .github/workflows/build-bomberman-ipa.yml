# Bomberman R 2 standalone IPA — GitHub Actions, macOS runner, no local Mac needed
# Repo: kashen-nb/nxnative, file at .github/workflows/build-bomberman-ipa.yml
# Game parts are in Mega folder https://mega.nz/folder/xBdHVaCD#OhRJFQjWYF7_W4jWH03QSw
# (3 files, total 5.11 GB: bomberman.xci.part-~aa 1.86 GB, part-~ab 1.86 GB, part-~ac 1.4 GB)
# Never push game files or prod.keys to a public repo.
#
# 3. Put prod.keys in GitHub Secrets as a base64 secret named PROD_KEYS_B64:
#    certutil -encode prod.keys prod.keys.b64  (Windows) — paste the b64 text, no newlines, into the secret.
#    Never put prod.keys in the repo, in an issue, or in a public link.
# 4. Run this workflow (Actions > Build Bomberman IPA > Run workflow).
# 5. Download the IPA from the run's Artifacts. Sign it with Sideloadly / AltStore.
#    iPhone needs iOS 26+, A17 Pro or newer. Bomberman has NO profile in
#    nxnative dm/games/, so this is a provisional build — it may not boot.
#    The survey + provisional profile are uploaded as artifacts too.
name: Build Bomberman IPA

on:
  workflow_dispatch:
    inputs:
      mega_folder_url:
        description: 'Mega folder URL with the 3 XCI parts'
        required: false
        default: 'https://mega.nz/folder/xBdHVaCD#OhRJFQjWYF7_W4jWH03QSw'
        type: string
      game_filename:
        description: 'Reassembled XCI filename'
        required: false
        default: 'SUPER BOMBERMAN R 2 [0100B87017D94000] [v393216].xci'
        type: string

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Checkout nxnative
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: main

      - name: Select Xcode 27.2
        run: |
          ls -d /Applications/Xcode*.app
          if [ -d /Applications/Xcode_27.2.app ]; then sudo xcode-select -s /Applications/Xcode_27.2.app; else sudo xcode-select -s /Applications/Xcode.app; fi
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain

      - name: Install build tools
        run: |
          brew install xcodegen zstd glslang megatools
          python3 -m pip install --break-system-packages lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'"

      - name: Download and reassemble XCI from Mega folder
        run: |
          mkdir -p ~/Games/Bomberman/parts
          megadl --path ~/Games/Bomberman/parts "${{ inputs.mega_folder_url }}"
          ls -lh ~/Games/Bomberman/parts/
          cat ~/Games/Bomberman/parts/bomberman.xci.part-* > ~/Games/Bomberman/"${{ inputs.game_filename }}"
          ls -lh ~/Games/Bomberman/
          rm -rf ~/Games/Bomberman/parts

      - name: Restore prod.keys from secret
        run: |
          echo "${{ secrets.PROD_KEYS_B64 }}" | base64 -d > ~/keys-prod.keys
          ls -l ~/keys-prod.keys
        env:
          PROD_KEYS_B64: ${{ secrets.PROD_KEYS_B64 }}

      - name: Build IPA (provisional profile — Bomberman has no profile in dm/games)
        run: |
          python3 scripts/build_ipa_from_nsp.py ~/Games/Bomberman -k ~/keys-prod.keys --romfs separate --allow-other-metal --progress lines
          ls -lh ~/Games/Bomberman/*.ipa ~/Games/Bomberman/*_build/ 2>/dev/null || true

      - name: Upload RomFS data pack (romfs.img, goes in the app's Documents as romfs.img)
        if: always()
        run: cp ~/Games/Bomberman/*_build/extract/*/RomFS.img ~/Games/Bomberman/romfs.img && ls -lh ~/Games/Bomberman/romfs.img

      - name: Upload bomberman-romfs artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bomberman-romfs
          path: ~/Games/Bomberman/romfs.img
          if-no-files-found: warn

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bomberman-ipa
          path: ~/Games/Bomberman/*.ipa
          if-no-files-found: warn

      - name: Upload survey and provisional profile (for debugging if it does not boot)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bomberman-survey
          path: |
            ~/Games/Bomberman/*_survey/
            ~/Games/Bomberman/*_build/profile/
            ~/Games/Bomberman/*_build/logs/
          if-no-files-found: warn
