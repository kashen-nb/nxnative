# Bomberman R 2 standalone IPA, run #10 — IPA-only, rebuilt from run #8 artifacts
# No XCI re-upload: the survey (ExeFS + profile + icon) and the romfs.img come
# from GitHub Actions run #8 (43708038569), whose artifacts are still available.
# The game is reassembled as a dump folder (exefs/ + unpacked romfs/) —
# a dump needs no prod.keys. Includes the friend:u fix and the Chinese
# launcher (main @ ec04c2f). Only the IPA is uploaded; romfs.img already
# lives in the app's Documents on the phone.
name: Build Bomberman IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout nxnative
        uses: actions/checkout@v4
        with:
          repository: kashen-nb/nxnative
          ref: main

      - name: Select Xcode 27.2
        run: |
          ls -d /Applications/Xcode*.app
          if [ -d /Applications/Xcode_27.2.app ]; then sudo xcode-select -s /Applications/Xcode_27.2.app; else sudo xcode-select -s /Applications/Xcode.app; fi
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain

      - name: Install build tools
        run: |
          brew install xcodegen zstd glslang
          python3 -m pip install --break-system-packages lz4 "capstone>=5,<6" fonttools nsz zbic "backports.zstd; python_version < '3.14'"

      - name: Download run #8 survey artifact (ExeFS + profile + icon)
        uses: actions/download-artifact@v4
        with:
          name: bomberman-survey
          run-id: 43708038569
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ~/Games/Bomberman/survey

      - name: Download run #8 romfs artifact (romfs.img)
        uses: actions/download-artifact@v4
        with:
          name: bomberman-romfs
          run-id: 43708038569
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ~/Games/Bomberman/romfs-dl

      - name: Assemble dump folder (exefs + unpacked romfs)
        run: |
          set -e
          SURVEY=~/Games/Bomberman/survey/0100B87017D94000_survey
          ls -lh "$SURVEY/extract/ExeFS/" "$SURVEY/extract/icon.jpg"
          ls -lh ~/Games/Bomberman/romfs-dl/romfs.img
          mkdir -p ~/Games/Bomberman/"SUPER BOMBERMAN R 2"/exefs
          cp "$SURVEY/extract/ExeFS/"* ~/Games/Bomberman/"SUPER BOMBERMAN R 2"/exefs/
          python3 - <<'EOF'
          import os, sys
          sys.path.insert(0, 'dm/tools')
          import romfs_image
          img = os.path.expanduser('~/Games/Bomberman/romfs-dl/romfs.img')
          out = os.path.expanduser('~/Games/Bomberman/SUPER BOMBERMAN R 2/romfs')
          idx = romfs_image.read_index(img)
          print('romfs entries:', len(idx))
          with open(img, 'rb') as f:
              for path, (is_dir, off, size) in sorted(idx.items()):
                  dst = os.path.join(out, path)
                  if is_dir:
                      os.makedirs(dst, exist_ok=True)
                  else:
                      os.makedirs(os.path.dirname(dst), exist_ok=True)
                      f.seek(off)
                      with open(dst, 'wb') as g:
                          remaining = size
                          while remaining:
                              chunk = f.read(min(remaining, 1 << 20))
                              if not chunk:
                                  break
                              g.write(chunk)
                              remaining -= len(chunk)
          print('unpacked to', out)
          EOF
          rm -f ~/Games/Bomberman/romfs-dl/romfs.img
          ls ~/Games/Bomberman/"SUPER BOMBERMAN R 2"/exefs/
          du -sh ~/Games/Bomberman/"SUPER BOMBERMAN R 2"/romfs

      - name: Build IPA from dump (friend:u fix + Chinese launcher, IPA only)
        run: |
          python3 scripts/build_ipa_from_nsp.py ~/Games/Bomberman/"SUPER BOMBERMAN R 2" --icon ~/Games/Bomberman/survey/0100B87017D94000_survey/extract/icon.jpg --romfs separate --allow-other-metal --progress lines
          find ~/Games/Bomberman -name '*.ipa' -o -name '*_build' -type d | head -20

      - name: Collect IPA
        if: always()
        run: |
          mkdir -p ~/Games/Bomberman/out
          find ~/Games/Bomberman -name '*.ipa' -not -path '*/out/*' -exec cp {} ~/Games/Bomberman/out/ \;
          ls -lh ~/Games/Bomberman/out/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bomberman-ipa
          path: ~/Games/Bomberman/out/*.ipa
          if-no-files-found: warn

      - name: Upload survey and provisional profile (for debugging if it does not boot)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bomberman-survey
          path: |
            ~/Games/Bomberman/**/profile/
            ~/Games/Bomberman/**/logs/
          if-no-files-found: warn
